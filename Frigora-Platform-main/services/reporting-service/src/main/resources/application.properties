spring.application.name=reporting-service
server.port=8085

# A separate database is mandatory. Never point this service at the monolith's schema.
spring.datasource.url=jdbc:mysql://${REPORTING_DB_HOST:localhost}:${REPORTING_DB_PORT:3306}/frigora_reporting_db?serverTimezone=UTC
spring.datasource.username=${REPORTING_DB_USERNAME}
spring.datasource.password=${REPORTING_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=com.frigora.frigoraplatform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Same UTF-8 HMAC key as the issuer, supplied externally; no Base64 decoding.
reporting.jwt.secret=${REPORTING_JWT_SECRET}
