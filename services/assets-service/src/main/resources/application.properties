spring.application.name=assets-service
server.port=8083

# Assets owns a dedicated schema. Never reuse the monolith, IAM, or Reporting database.
spring.datasource.url=jdbc:mysql://${ASSETS_DB_HOST:localhost}:${ASSETS_DB_PORT:3306}/frigora_assets_db?serverTimezone=UTC
spring.datasource.username=${ASSETS_DB_USERNAME}
spring.datasource.password=${ASSETS_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

# Supply the same UTF-8 HMAC secret used by IAM through the local environment.
assets.jwt.secret=${ASSETS_JWT_SECRET}
