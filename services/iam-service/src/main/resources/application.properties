spring.application.name=iam-service
server.port=8082
spring.datasource.url=jdbc:mysql://${IAM_DB_HOST:localhost}:${IAM_DB_PORT:3306}/frigora_iam_db?serverTimezone=UTC
spring.datasource.username=${IAM_DB_USERNAME}
spring.datasource.password=${IAM_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=com.frigora.frigoraplatform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
authorization.jwt.secret=${IAM_JWT_SECRET}
authorization.jwt.expiration.days=7
